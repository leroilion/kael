name: Build and publish Kael

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Compile book
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-lang-french \
            python3 \
            python3-yaml \
            python3-pil \
            pandoc

      - name: Compile PDF and EPUB
        run: make all

      - name: Check generated files
        run: |
          test -f kael.pdf
          test -f kael.epub
          ls -lh kael.pdf kael.epub

      - name: Prepare GitHub Pages
        run: |
          rm -rf _site
          mkdir -p _site

          cp kael.pdf _site/kael.pdf
          cp kael.epub _site/kael.epub

          cat > _site/index.html <<EOF
          <!DOCTYPE html>
          <html lang="fr">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Kael — La voie de l'Orc</title>
          </head>
          <body>
            <h1>Kael — La voie de l'Orc</h1>
            <p>Lore et histoire du personnage, de sa naissance au début de ses aventures.</p>

            <p>
              <a href="kael.pdf?v=${GITHUB_SHA}">
                Télécharger le lore au format PDF
              </a>
            </p>

            <p>
              <a href="kael.epub?v=${GITHUB_SHA}">
                Télécharger le lore au format EPUB
              </a>
            </p>
          </body>
          </html>
          EOF

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Publish GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
